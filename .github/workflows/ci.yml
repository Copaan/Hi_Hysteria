name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned private test tooling
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck qrencode openssl ca-certificates python3
          export HIHY_YQ_BIN="$RUNNER_TEMP/hihy-tools/yq"
          source server/hy2.sh
          installPrivateYq
          echo "$(dirname "$HIHY_YQ_BIN")" >>"$GITHUB_PATH"
      - name: Check generated scripts, integrity and Chinese messages
        run: |
          bash scripts/build.sh
          git diff --exit-code server/hy2.sh server/install.sh server/SHA256SUMS
          bash server/test_build.sh
          python3 server/test_messages.py
          shellcheck -S error server/hy2.sh server/install.sh server/test_*.sh scripts/*.sh
      - name: Focused tests
        run: |
          bash server/test_bootstrap_install.sh
          bash server/test_install_recovery.sh
          bash server/test_security.sh
          bash server/test_auto_config.sh
          bash server/test_client_config.sh
          bash scripts/package.sh
          python3 server/test_package.py
  linux-integration:
    needs: lint-and-test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:12', 'ubuntu:24.04']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Real install, rollback and three-client transport
        env:
          TEST_IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm --privileged --init -v "$PWD":/repo:ro "$TEST_IMAGE" bash -c '
            set -euo pipefail
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq bash curl wget ca-certificates openssl lsof iptables iproute2 bc dnsutils qrencode cron procps util-linux python3
            touch /etc/hihy-test-environment
            cd /repo
            bash server/test_lifecycle.sh
            bash scripts/fetch-test-cores.sh /opt/hihy-test-cores
            export HIHY_TEST_CORES=/opt/hihy-test-cores
            bash server/test_server_edits.sh
            python3 server/test_transport.py
            hihy uninstall
            test ! -e /etc/hihy
          '
  subscription-systemd:
    needs: lint-and-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Full HTTPS subscription lifecycle on a disposable systemd runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bash curl wget ca-certificates openssl lsof iptables iproute2 bc dnsutils qrencode cron procps util-linux python3
          sudo touch /etc/hihy-test-environment
          sudo bash server/test_lifecycle.sh
          sudo bash scripts/fetch-test-cores.sh /opt/hihy-test-cores
          sudo env HIHY_SUB_TEST_KEEP=1 bash server/test_subscription_lifecycle.sh
          sudo env HIHY_TEST_CORES=/opt/hihy-test-cores HIHY_TEST_SUBSCRIPTION=1 CURL_CA_BUNDLE=/var/lib/hihy-sub/caddy/test-ca.crt python3 server/test_transport.py
      - name: Remove test installation
        if: always()
        run: |
          if test -f /etc/hihy-test-environment && test -x /usr/bin/hihy; then sudo /usr/bin/hihy uninstall; fi
