name: Release
on:
  push:
    tags: ["ver*"]
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  release:
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build reviewed local bundle
        run: |
          bash scripts/package.sh
          git diff --exit-code server/hy2.sh server/SHA256SUMS
          script_version=$(sed -n 's/^hihyV="\([^"]*\)"$/\1/p' server/hy2.sh)
          test "$script_version" = "$GITHUB_REF_NAME"
      - name: Publish complete package and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.sha256 --title "$GITHUB_REF_NAME" --generate-notes
